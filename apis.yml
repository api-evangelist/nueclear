aid: nueclear
name: Nueclear
description: 'Nueclear Healthcare Limited, founded in 2011 and powered by Thyrocare,
  is one of India''s leading cancer-diagnostics chains, operating a nationwide network
  of PET-CT and CT scan centres. It offers advanced whole-body, PSMA, DOPA, brain
  and bone PET-CT scans plus plain and contrast CT imaging for cancer diagnosis at
  affordable rates, with centres across Mumbai, Navi Mumbai, Delhi, Hyderabad, Bangalore,
  Lucknow, Nashik and Surat. Nueclear is a consumer diagnostic-imaging provider and
  publishes no public developer API surface.'
